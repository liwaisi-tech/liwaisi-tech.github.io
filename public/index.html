<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <!-- SEO & Metadatos Oficiales -->
  <title>Liwaisi Tech | Tecnología Práctica para el Comercio Rural · Soki AI</title>
  <meta name="description" content="Empodera tu negocio rural con Soki by Liwaisi, el asistente comercial automático en WhatsApp para control de caja, registro de ventas y cuentas fiadas en Casanare.">
  <meta name="keywords" content="Liwaisi Tech, Soki AI, tecnologia rural, asistente comercial WhatsApp, registro de ventas, control de caja, Casanare, Aguazul, Mani">
  <meta name="author" content="Liwaisi Tecnología Rural Sostenible S.A.S.">
  <meta name="theme-color" content="#0D1B1E">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://liwaisi.tech/">

  <!-- Open Graph / Meta & Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://liwaisi.tech/">
  <meta property="og:title" content="Liwaisi Tech | Empodera tu Negocio Rural con Tecnología Práctica">
  <meta property="og:description" content="Conoce Soki by Liwaisi: asistente comercial automático en WhatsApp. Piloto cerrado para comerciantes rurales.">
  <meta property="og:image" content="https://liwaisi.tech/favicon.png">

  <!-- Favicon / Logo Oficial -->
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Hoja de Estilos CSS3 Pura (Eco-Diseño & Monospace) -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- =======================================================================
       1. HEADER (Navegación Mínima)
       ======================================================================= -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- Logo: Liwaisi Tech (Delta Sikuani + Texto Dinámico) -->
      <a href="#hero" class="brand-link" aria-label="Ir al inicio de Liwaisi Tech">
        <img src="/favicon.png" alt="Liwaisi Logo" class="brand-logo-icon" width="24" height="24">
        <span class="brand-name" data-text="navbar.brand"></span>
      </a>

      <!-- Enlaces de Navegación de Escritorio -->
      <nav class="nav-desktop" aria-label="Navegación principal">
        <a href="#hero" class="nav-link" data-text="navbar.home"></a>
        <a href="#caracteristicas" class="nav-link" data-text="navbar.product"></a>
        <a href="#impacto" class="nav-link" data-text="navbar.impact"></a>
        <a href="#postula" class="nav-link" data-text="navbar.pilot"></a>
      </nav>

      <!-- Acciones de Cabecera: Toggle Modo Claro/Oscuro & Botón Hamburguesa -->
      <div class="header-actions">
        <!-- Toggle Modo Claro / Oscuro -->
        <button id="themeToggleBtn" class="theme-toggle" type="button">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel" data-text="navbar.themeLight"></span>
        </button>

        <!-- Botón Menú Hamburguesa Móvil -->
        <button id="menuToggleBtn" class="menu-toggle-btn" type="button" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="mobileNavMenu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Menú Desplegable Móvil -->
    <nav id="mobileNavMenu" class="mobile-nav-menu" aria-label="Menú móvil">
      <a href="#hero" class="nav-link" data-text="navbar.home"></a>
      <a href="#caracteristicas" class="nav-link" data-text="navbar.product"></a>
      <a href="#impacto" class="nav-link" data-text="navbar.impact"></a>
      <a href="#postula" class="nav-link" data-text="navbar.pilot"></a>
    </nav>
  </header>

  <main>
    <!-- =======================================================================
         2. HERO SECTION (Validación de Producto para Meta)
         ======================================================================= -->
    <section id="hero" class="hero-section" aria-labelledby="heroTitle">
      <div class="container">
        <div class="hero-content">
          <!-- Título Principal (H1) -->
          <h1 id="heroTitle" class="hero-title" data-text="hero.title"></h1>
          
          <!-- Subtítulo (H2) -->
          <h2 id="heroSubtitle" class="hero-subtitle" data-text="hero.subtitle"></h2>
          
          <!-- Call to Action (Botón) -->
          <a href="#postula" class="hero-cta-btn" id="heroCtaBtn">
            <span data-text="hero.cta"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- Contenedor de Secciones con Fondo Homogéneo -->
    <div class="main-content-wrapper">
      <div class="container">

        <!-- =====================================================================
             3. SECCIÓN DE CARACTERÍSTICAS (Soki by Liwaisi)
             ===================================================================== -->
        <section id="caracteristicas" class="features-section" aria-labelledby="featuresTitle">
          <header class="section-header">
            <!-- Título (H2) -->
            <h2 id="featuresTitle" class="section-title" data-text="features.title"></h2>
          </header>

          <!-- Layout CSS Grid 2x2 / 4x1 con SVGs Inline Dinámicos -->
          <div class="features-grid">
            <!-- Tarjeta 1: Registro de Ventas y Fiados -->
            <article class="feature-card">
              <div class="feature-icon-wrapper" aria-hidden="true">
                <svg class="feature-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="10" y="6" width="28" height="36" rx="4" stroke="currentColor" stroke-width="2.5"/>
                  <path d="M16 14H32M16 20H26M16 26H28M16 32H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M28 26L38 36L34 40L24 30L28 26Z" fill="var(--color-action)" stroke="currentColor" stroke-width="2"/>
                  <path d="M24 30L23 35L28 34" fill="currentColor"/>
                </svg>
              </div>
              <h3 class="feature-card-title" data-text="features.card1"></h3>
            </article>

            <!-- Tarjeta 2: Control de Caja Diario -->
            <article class="feature-card">
              <div class="feature-icon-wrapper" aria-hidden="true">
                <svg class="feature-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="8" y="18" width="32" height="24" rx="3" stroke="currentColor" stroke-width="2.5"/>
                  <rect x="14" y="8" width="20" height="10" rx="2" stroke="currentColor" stroke-width="2" fill="var(--color-action)"/>
                  <path d="M18 13H30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <rect x="12" y="24" width="16" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="33" cy="25" r="1.5" fill="currentColor"/>
                  <circle cx="37" cy="25" r="1.5" fill="currentColor"/>
                  <circle cx="33" cy="29" r="1.5" fill="currentColor"/>
                  <circle cx="37" cy="29" r="1.5" fill="currentColor"/>
                  <rect x="12" y="35" width="24" height="3" rx="1" fill="var(--color-action)" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </div>
              <h3 class="feature-card-title" data-text="features.card2"></h3>
            </article>

            <!-- Tarjeta 3: Análisis de Rentabilidad -->
            <article class="feature-card">
              <div class="feature-icon-wrapper" aria-hidden="true">
                <svg class="feature-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M24 6A18 18 0 0 0 6 24A18 18 0 1 0 36.7 11.3L24 24V6Z" fill="var(--color-action)" stroke="currentColor" stroke-width="2.5"/>
                  <path d="M28 4.5V20H43.5A18 18 0 0 0 28 4.5Z" fill="#F4D03F" stroke="currentColor" stroke-width="2"/>
                  <text x="32" y="15" font-family="monospace" font-size="7" font-weight="900" fill="#0D1B1E">%</text>
                </svg>
              </div>
              <h3 class="feature-card-title" data-text="features.card3"></h3>
            </article>

            <!-- Tarjeta 4: Interacción nativa en WhatsApp -->
            <article class="feature-card">
              <div class="feature-icon-wrapper" aria-hidden="true">
                <svg class="feature-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 24C12 17.37 17.37 12 24 12C30.63 12 36 17.37 36 24C36 30.63 30.63 36 24 36C21.45 36 19.08 35.21 17.11 33.86L10 36L12.2 29.1C12.07 27.46 12 25.75 12 24Z" fill="var(--color-action)" stroke="currentColor" stroke-width="2"/>
                  <rect x="18" y="19" width="12" height="10" rx="3" stroke="currentColor" stroke-width="2"/>
                  <circle cx="21" cy="24" r="1.2" fill="currentColor"/>
                  <circle cx="27" cy="24" r="1.2" fill="currentColor"/>
                  <path d="M24 16V19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="24" cy="15.5" r="1" fill="#F4D03F"/>
                </svg>
              </div>
              <h3 class="feature-card-title" data-text="features.card4"></h3>
            </article>
          </div>
        </section>

        <!-- =====================================================================
             4. SECCIÓN DE IMPACTO VERIFICABLE (Prueba Social)
             ===================================================================== -->
        <section id="impacto" class="impact-section" aria-labelledby="impactTitle">
          <header class="section-header">
            <!-- Título (H2) -->
            <h2 id="impactTitle" class="section-title" data-text="impact.title"></h2>
          </header>

          <!-- Grid con 3 Casos de Uso con formato <picture> y loading="lazy" -->
          <div class="impact-grid">
            <!-- Caso 1: Cafetería La Casaba -->
            <article class="impact-card">
              <div class="impact-image-container">
                <picture>
                  <source srcset="/assets/images/cafeteria-la-casaba-desktop.webp" media="(min-width: 600px)" type="image/webp">
                  <source srcset="/assets/images/cafeteria-la-casaba-mobile.webp" type="image/webp">
                  <img src="/assets/images/cafeteria-la-casaba-desktop.webp"
                    data-alt="impact.cases.case1.alt" alt="Cafetería La Casaba" width="400" height="250"
                    loading="lazy">
                </picture>
              </div>
              <div class="impact-card-body">
                <h3 class="impact-card-title" data-text="impact.cases.case1.title"></h3>
                <button type="button" class="btn-case-study" data-case="case1" data-text="impact.btnCaseStudy" aria-haspopup="dialog"></button>
              </div>
            </article>

            <!-- Caso 2: Cafetería en Aguazul -->
            <article class="impact-card">
              <div class="impact-image-container">
                <picture>
                  <source srcset="/assets/images/cafe-aguazul.webp" media="(min-width: 600px)" type="image/webp">
                  <source srcset="/assets/images/cafe-aguazul-mobile.webp" type="image/webp">
                  <img src="/assets/images/cafe-aguazul.webp" data-alt="impact.cases.case2.alt" alt="Cafetería en Aguazul"
                    width="400" height="250" loading="lazy">
                </picture>
              </div>
              <div class="impact-card-body">
                <h3 class="impact-card-title" data-text="impact.cases.case2.title"></h3>
                <button type="button" class="btn-case-study" data-case="case2" data-text="impact.btnCaseStudy" aria-haspopup="dialog"></button>
              </div>
            </article>

            <!-- Caso 3: Bootcamp Huertics -->
            <article class="impact-card">
              <div class="impact-image-container">
                <picture>
                  <source srcset="/assets/images/bootcamp-huertics.webp" media="(min-width: 600px)" type="image/webp">
                  <source srcset="/assets/images/bootcamp-huertics-mobile.webp" type="image/webp">
                  <img src="/assets/images/bootcamp-huertics.webp"
                    data-alt="impact.cases.case3.alt" alt="Bootcamp Huertics en Maní" width="400" height="250"
                    loading="lazy">
                </picture>
              </div>
              <div class="impact-card-body">
                <h3 class="impact-card-title" data-text="impact.cases.case3.title"></h3>
                <button type="button" class="btn-case-study" data-case="case3" data-text="impact.btnCaseStudy" aria-haspopup="dialog"></button>
              </div>
            </article>
          </div>
        </section>

        <!-- =====================================================================
             5. SECCIÓN DE CAPTACIÓN (Formulario Nativo de Acceso al Piloto)
             ===================================================================== -->
        <section id="postula" class="capture-section" aria-labelledby="captureTitle">
          <div class="capture-box">
            <header class="capture-header">
              <!-- Título (H2) -->
              <h2 id="captureTitle" class="capture-title" data-text="capture.title"></h2>
              <!-- Texto Explicativo -->
              <p class="capture-description" data-text="capture.description"></p>
            </header>

            <!-- Formulario de HTML Nativo Accesible -->
            <form id="sokiPilotForm" class="native-form" method="POST" action="#">
              <div class="form-group">
                <label for="nombreInput" class="form-label" data-text="capture.nameLabel"></label>
                <input type="text" id="nombreInput" name="nombre" class="form-input" data-placeholder="capture.namePlaceholder"
                  required autocomplete="name">
              </div>

              <div class="form-group">
                <label for="emailInput" class="form-label" data-text="capture.emailLabel"></label>
                <input type="email" id="emailInput" name="email" class="form-input" data-placeholder="capture.emailPlaceholder"
                  required autocomplete="email">
              </div>

              <div class="form-group">
                <label for="tipoNegocioInput" class="form-label" data-text="capture.businessTypeLabel"></label>
                <input type="text" id="tipoNegocioInput" name="tipo_negocio" class="form-input"
                  data-placeholder="capture.businessTypePlaceholder" required>
              </div>

              <div class="form-group">
                <label for="municipioInput" class="form-label" data-text="capture.municipalityLabel"></label>
                <input type="text" id="municipioInput" name="municipio" class="form-input"
                  data-placeholder="capture.municipalityPlaceholder" required>
              </div>

              <div class="form-group">
                <label for="whatsappInput" class="form-label" data-text="capture.whatsappLabel"></label>
                <input type="tel" id="whatsappInput" name="whatsapp" class="form-input" data-placeholder="capture.whatsappPlaceholder"
                  required pattern="[0-9+ ]{7,15}" autocomplete="tel">
              </div>

              <!-- Botón Submit -->
              <button type="submit" id="submitBtn" class="submit-btn">
                <span data-text="capture.submitButton"></span>
              </button>

              <!-- Feedback del Envío -->
              <div id="formFeedback" class="form-feedback" role="alert"></div>
            </form>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- =======================================================================
       6. FOOTER (Crítico para Aprobación Legal y Meta)
       ======================================================================= -->
  <footer class="site-footer">
    <div class="container">
      <!-- Estructura a 2 Columnas -->
      <div class="footer-grid">
        <!-- Columna 1: Datos Legales Oficiales -->
        <div class="footer-col-legal">
          <p class="footer-company-name" data-text="footer.companyName"></p>
          <p class="footer-nit" data-text="footer.nit"></p>
          <p class="footer-address" data-text="footer.address"></p>
        </div>

        <!-- Columna 2: Enlaces Legales -->
        <div class="footer-col-links">
          <a href="/soki/privacidad" class="footer-privacy-link" data-text="footer.privacyLink"></a>
          <a href="/soki/terminos" class="footer-privacy-link" data-text="footer.termsLink"></a>
        </div>
      </div>

      <div class="footer-divider" aria-hidden="true"></div>

      <!-- Copyright Inferior Exacto -->
      <p class="footer-copyright" data-text="footer.copyright"></p>
    </div>
  </footer>

  <!-- Modal Emergente: Caso de Éxito -->
  <div id="caseModal" class="case-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Cerrar ventana emergente">✕</button>
      <div class="modal-image-container">
        <img id="modalImage" src="" alt="" width="500" height="300" loading="lazy">
      </div>
      <div class="modal-body">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalDescription" class="modal-description"></p>
        <ul id="modalPoints" class="modal-points"></ul>
      </div>
    </div>
  </div>

  <!-- Script Minimalista Eco-Diseñado (< 2 KB) -->
  <script src="/js/app.js"></script>
</body>
</html>
