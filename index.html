        <section id="postula" class="capture-section" aria-labelledby="captureTitle">
          <div class="capture-box">
            <header class="capture-header">
              <!-- Título (H2) -->

              <!-- Texto Explicativo -->
              <p class="capture-description" data-text="capture.description"></p>
            </header>

            <!-- Formulario de HTML Nativo Accesible -->
            <form id="sokiPilotForm" class="native-form" method="POST" action="#">
              <div class="form-group">
                <label for="nombreInput" class="form-label" data-text="capture.nameLabel"></label>
                <input type="text" id="nombreInput" name="nombre" class="form-input" data-placeholder="capture.namePlaceholder"
                  required autocomplete="name">
              </div>

              <div class="form-group">
                <label for="emailInput" class="form-label" data-text="capture.emailLabel"></label>
                <input type="email" id="emailInput" name="email" class="form-input" data-placeholder="capture.emailPlaceholder"
                  required autocomplete="email">
              </div>

              <div class="form-group">
                <label for="tipoNegocioInput" class="form-label" data-text="capture.businessTypeLabel"></label>
                <input type="text" id="tipoNegocioInput" name="tipo_negocio" class="form-input"
                  data-placeholder="capture.businessTypePlaceholder" required>
              </div>

              <div class="form-group">
                <label for="municipioInput" class="form-label" data-text="capture.municipalityLabel"></label>
                <input type="text" id="municipioInput" name="municipio" class="form-input"
                  data-placeholder="capture.municipalityPlaceholder" required>
              </div>

              <div class="form-group">
                <label for="whatsappInput" class="form-label" data-text="capture.whatsappLabel"></label>
                <input type="tel" id="whatsappInput" name="whatsapp" class="form-input" data-placeholder="capture.whatsappPlaceholder"
                  required pattern="[0-9+ ]{7,15}" autocomplete="tel">
              </div>

              <!-- Botón Submit -->
              <button type="submit" id="submitBtn" class="submit-btn">
                <span data-text="capture.submitButton"></span>
              </button>

              <!-- Feedback del Envío -->
              <div id="formFeedback" class="form-feedback" role="alert"></div>
            </form>
          </div>
